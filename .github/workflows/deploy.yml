# Deploys the site to Cloudflare on every push to main, and by hand.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts edit, Workers KV edit, D1 edit,
#                          R2 edit, Workers AI read (SETUP.md, section 1)
#   CLOUDFLARE_ACCOUNT_ID  the account the djmanzo Worker is on
# Without them the job says so and stops; nothing is deployed.
#
# The build does not need app/ (djmanzo, private): only the tests read it.
# Tests run when APP_READ_TOKEN (read access to joehannes/djmanzo) is set.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_READ_TOKEN: ${{ secrets.APP_READ_TOKEN }}
      # A repository secret, or a repository variable of the same name.
      # The token belongs in Secrets; the account id is not secret.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: The token and the account are set
        env:
          TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          TOKEN_VARIABLE: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          ACCOUNT_VARIABLE: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "CLOUDFLARE_API_TOKEN: secret $TOKEN_SECRET, variable $TOKEN_VARIABLE"
          echo "CLOUDFLARE_ACCOUNT_ID: secret $ACCOUNT_SECRET, variable $ACCOUNT_VARIABLE"
          if [ "$TOKEN_VARIABLE" = "true" ] && [ "$TOKEN_SECRET" != "true" ]; then
            echo "::warning::The API token is a repository variable, which anyone who can see the repository's settings can read. Move it to Secrets."
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be repository secrets (Settings -> Secrets and variables -> Actions -> Secrets -> New repository secret), not environment, Codespaces or Dependabot secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: djmanzo as app/, for the tests
        if: ${{ env.APP_READ_TOKEN != '' }}
        run: |
          git config --global url."https://x-access-token:${APP_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --depth 50 app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (svelte-check, then vite)
        run: npm run build
      - name: Unit tests
        if: ${{ hashFiles('app/Cargo.toml') != '' }}
        run: npm test
      - name: Database migrations
        run: npx wrangler d1 migrations apply djmanzo --remote
      - name: Deploy
        run: npx wrangler deploy
